<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirect</title>
    <script type="text/javascript">
      var l = window.location;
      // Only redirect if '?p=' is not present
      if (!l.search.includes('p=')) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/portfolio_website/?p=/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
  </body>
</html>
